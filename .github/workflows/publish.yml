name: Publish stable release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: nuxt-content-mermaid-stable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release identity
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "Stable releases require an annotated tag." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag does not identify the checked-out commit." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const tag = process.env.GITHUB_REF_NAME
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
            throw new Error('Release tag must be an exact stable version.')
          }

          const version = tag.slice(1)
          const manifest = JSON.parse(await readFile('package.json', 'utf8'))
          if (manifest.version !== version) {
            throw new Error('Release tag and package.json version do not match.')
          }

          const changelog = await readFile('CHANGELOG.md', 'utf8')
          if (!changelog.split(/\r?\n/).some(line => line.trim() === '## v' + version)) {
            throw new Error('CHANGELOG.md is missing the release heading.')
          }
          NODE

      - name: Enable pinned package managers
        run: |
          npm install --global --force corepack@0.35.0
          corepack enable
          npm install --global npm@11.17.0
          npm --version
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify and retain publishable artifact
        id: artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/release-artifact
        run: |
          mkdir -p "$ARTIFACT_DIRECTORY"
          node scripts/release-verification/package-artifact.mjs \
            --profile v3-known-latest \
            --artifact-directory "$ARTIFACT_DIRECTORY"

          set -- "$ARTIFACT_DIRECTORY"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one verified package archive." >&2
            exit 1
          fi
          echo "archive=$1" >> "$GITHUB_OUTPUT"

      - name: Publish verified package
        env:
          PACKAGE_ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: >-
          npm publish "$PACKAGE_ARCHIVE"
          --access public
          --tag latest
          --ignore-scripts
          --provenance

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm changelogen gh release "${GITHUB_REF_NAME#v}"
