name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable exact version to publish (x.y.z)
        required: true
        type: string

permissions: {}

concurrency:
  group: nuxt-content-mermaid-stable-release
  cancel-in-progress: false

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      archive-filename: ${{ steps.identity.outputs.archive-filename }}
      integrity-sha512: ${{ steps.identity.outputs.integrity-sha512 }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Verify Release PR and release identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-verification/release-workflow.mjs preflight --version "$RELEASE_VERSION"

      - name: Enable Corepack
        run: npm install --global --force corepack@latest && corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare module and playground
        run: pnpm dev:prepare

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify source
        run: pnpm verify:source

      - name: Pack publishable artifact once
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release-verification/release-workflow.mjs pack
          --version "$RELEASE_VERSION"
          --artifact-directory "$RUNNER_TEMP/release-artifact"
          > "$RUNNER_TEMP/release-manifest.json"

      - name: Export immutable artifact identity
        id: identity
        env:
          ARTIFACT_NAME: release-${{ github.run_id }}-${{ github.run_attempt }}
          MANIFEST_PATH: ${{ runner.temp }}/release-manifest.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile(process.env.MANIFEST_PATH, 'utf8'))
          await appendFile(process.env.GITHUB_OUTPUT, [
            `artifact-name=${process.env.ARTIFACT_NAME}`,
            `archive-filename=${manifest.artifact.filename}`,
            `integrity-sha512=${manifest.artifact.integritySha512}`,
            '',
          ].join('\n'))
          NODE

      - name: Upload immutable publishable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/release-artifact/*.tgz
            ${{ runner.temp }}/release-artifact/artifact.sha512
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: v3-minimum
            node-version: '22.19.0'
          - profile: v3-known-latest
            node-version: '24.19.0'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: npm install --global --force corepack@latest && corepack enable

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Download publishable artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-and-pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify compatibility profile against downloaded artifact
        env:
          ARCHIVE_FILENAME: ${{ needs.verify-and-pack.outputs.archive-filename }}
          PROFILE: ${{ matrix.profile }}
        run: >-
          node scripts/release-verification/package-artifact.mjs
          --package-source artifact
          --archive "$RUNNER_TEMP/release-artifact/$ARCHIVE_FILENAME"
          --checksum "$RUNNER_TEMP/release-artifact/artifact.sha512"
          --profile "$PROFILE"

  publish:
    needs: [verify-and-pack, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Install Trusted Publishing npm CLI
        run: npm install --global npm@11.17.0 && npm --version

      - name: Download verified publishable artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-and-pack.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Reconcile and publish through npm OIDC
        env:
          ARCHIVE_FILENAME: ${{ needs.verify-and-pack.outputs.archive-filename }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release-verification/release-workflow.mjs publish
          --version "$RELEASE_VERSION"
          --archive "$RUNNER_TEMP/release-artifact/$ARCHIVE_FILENAME"
          --checksum "$RUNNER_TEMP/release-artifact/artifact.sha512"

  registry-smoke:
    needs: [verify-and-pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Enable Corepack
        run: npm install --global --force corepack@latest && corepack enable

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify exact public registry package
        env:
          ARTIFACT_INTEGRITY: ${{ needs.verify-and-pack.outputs.integrity-sha512 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release-verification/release-workflow.mjs registry-smoke
          --version "$RELEASE_VERSION"
          --integrity "$ARTIFACT_INTEGRITY"

  finalize:
    needs: [verify-and-pack, registry-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Reconcile annotated tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          node scripts/release-verification/release-workflow.mjs finalize
          --version "$RELEASE_VERSION"
          --sha "${{ github.sha }}"
