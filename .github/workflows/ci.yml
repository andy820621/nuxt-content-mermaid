name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  source-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'

      - name: Validate Release PR declaration
        if: github.event_name == 'pull_request'
        run: node scripts/release-verification/release-workflow.mjs validate-pr --event-path "$GITHUB_EVENT_PATH"

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Playground prepare
        run: npm run dev:prepare

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Verify documentation website
        run: pnpm verify:website

      - name: Verify source
        run: pnpm verify:source

  final-compatibility-profiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: v3-minimum
            node-version: '22.19.0'
          - profile: v3-known-latest
            node-version: '24.19.0'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Prepare Nuxt types and module stubs
        run: npm run dev:prepare

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Verify Final Compatibility Profile
        run: npm run test:compatibility-profile -- --profile ${{ matrix.profile }}
